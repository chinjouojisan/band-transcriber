<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band Transcriber - ローカル採譜試作</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f1f5f9;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:1.5rem}p,small{color:#b7c4d5;line-height:1.65}.panel{background:#1d2a3c;padding:18px;border-radius:14px;margin:15px 0}button,input{font:inherit}input{max-width:100%}button{background:#68b9ed;color:#081321;border:0;padding:12px 17px;border-radius:9px;font-weight:bold;margin:8px 6px 8px 0}button:disabled{opacity:.45}label{display:block;margin:12px 0}input[type=number]{width:75px;padding:8px;border-radius:7px;border:1px solid #62718a;background:#101827;color:white}#notes{overflow:auto;max-height:340px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #465268;text-align:left}#status{white-space:pre-wrap}code{color:#c8e7ff}.muted{font-size:.9rem}</style></head><body><main><h1>🎼 Band Transcriber</h1><p>iPhone用・端末内処理の採譜試作品（v0.1）。音源は外部に送信しません。</p><div class="panel"><label>① 音源を選択（M4A / MP3 / WAV）<input type="file" id="file" accept="audio/*,.m4a"></label><audio id="player" controls style="width:100%"></audio><p id="info">ファイル未選択</p></div><div class="panel"><strong>② 解析する区間</strong><label>開始位置（秒） <input id="start" type="number" min="0" value="0" step="1"></label><label>解析時間（秒） <input id="duration" type="number" min="1" max="30" value="10" step="1"></label><button id="analyze" disabled>音程候補を解析</button><p id="status" role="status">準備中</p></div><div class="panel"><strong>③ 解析結果</strong><p class="muted">単音の目立つフレーズ向けの簡易推定です。完成音源の楽器分離、コード、ドラム、正確なTAB譜は未対応です。</p><button id="csv" disabled>結果をCSV保存</button><div id="notes"></div></div><p class="muted">プライバシー：外部ライブラリ・通信・解析APIを使用しません。ファイルはこのページを開いている端末内でのみ処理されます。GitHub Pagesで公開しても、選択した音源はアップロードされません。</p></main><script>
const $=id=>document.getElementById(id);let buffer=null,results=[],url=null;const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;$('analyze').disabled=true;$('info').textContent='読み込み中…';try{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('player').src=url;const ctx=new (window.AudioContext||window.webkitAudioContext)();buffer=await ctx.decodeAudioData(await f.arrayBuffer());await ctx.close();$('info').textContent=`${f.name} / ${buffer.duration.toFixed(1)}秒 / ${buffer.sampleRate}Hz`;$('analyze').disabled=false;$('status').textContent='読み込み完了。解析を開始できます。';}catch(err){$('info').textContent='読み込みに失敗しました。iPhoneで再生できるM4Aか確認してください。 '+err.message;}});
function pitch(samples,sr){let n=samples.length,mean=0;for(let i=0;i<n;i++)mean+=samples[i];mean/=n;let power=0;for(let i=0;i<n;i++){samples[i]-=mean;power+=samples[i]*samples[i]}if(Math.sqrt(power/n)<.012)return null;const minLag=Math.max(2,Math.floor(sr/1000)),maxLag=Math.min(n/2,Math.floor(sr/75));let best=-1,lag=0;for(let k=minLag;k<=maxLag;k++){let dot=0,a=0,b=0;for(let i=0;i<n-k;i+=2){let x=samples[i],y=samples[i+k];dot+=x*y;a+=x*x;b+=y*y}const corr=dot/Math.sqrt(a*b+1e-12);if(corr>best){best=corr;lag=k}}if(best<.75)return null;const hz=sr/lag,midi=Math.round(69+12*Math.log2(hz/440));if(midi<24||midi>96)return null;return {midi,hz,confidence:best};}
$('analyze').onclick=async()=>{if(!buffer)return;let start=Math.max(0,Number($('start').value)||0),duration=Math.max(1,Math.min(30,Number($('duration').value)||10));if(start>=buffer.duration){$('status').textContent='開始位置が曲の長さを超えています。';return}const sr=buffer.sampleRate,step=Math.round(sr*.15),win=Math.min(8192,Math.max(2048,Math.round(sr*.09))),from=Math.floor(start*sr),to=Math.min(buffer.length,Math.floor((start+duration)*sr));results=[];$('analyze').disabled=true;$('csv').disabled=true;$('notes').textContent='';$('status').textContent='解析中…';let previous=null;for(let pos=from;pos+win<to;pos+=step){const samples=new Float32Array(win);for(let i=0;i<win;i++){let v=0;for(let ch=0;ch<buffer.numberOfChannels;ch++)v+=buffer.getChannelData(ch)[pos+i];samples[i]=v/buffer.numberOfChannels}const p=pitch(samples,sr);if(p){const note=names[p.midi%12]+(Math.floor(p.midi/12)-1),t=pos/sr;if(previous&&previous.midi===p.midi&&t-previous.end<.25){previous.end=t+.15;previous.confidence=Math.max(previous.confidence,p.confidence)}else{previous={start:t,end:t+.15,note,midi:p.midi,confidence:p.confidence};results.push(previous)}}else previous=null;if(results.length%15===0)await new Promise(r=>setTimeout(r,0));}$('status').textContent=`解析完了：${results.length}件の音程候補。複数楽器の音が混ざると誤判定が増えます。`;$('analyze').disabled=false;$('csv').disabled=!results.length;render()};
function render(){const wrap=$('notes');wrap.textContent='';if(!results.length){wrap.textContent='候補が見つかりませんでした。';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>開始秒</th><th>終了秒</th><th>音名</th><th>MIDI</th><th>推定一致度</th></tr></thead>';const tbody=document.createElement('tbody');for(const r of results){const tr=document.createElement('tr');for(const v of [r.start.toFixed(2),r.end.toFixed(2),r.note,r.midi,(r.confidence*100).toFixed(0)+'%']){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}tbody.appendChild(tr)}table.appendChild(tbody);wrap.appendChild(table)}
$('csv').onclick=()=>{const rows=['start_seconds,end_seconds,note,midi,confidence',...results.map(r=>[r.start.toFixed(3),r.end.toFixed(3),r.note,r.midi,r.confidence.toFixed(3)].join(','))];const a=document.createElement('a'),blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob);a.href=u;a.download='pitch-candidates.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};$('status').textContent='M4Aファイルを選択してください。';
</script></body></html>
