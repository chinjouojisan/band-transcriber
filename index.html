<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Band Transcriber v0.3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#eef3ff;margin:0;padding:22px;line-height:1.55}main{max-width:680px;margin:auto}h1{font-size:23px}small,.muted{color:#aebcd1}.panel{background:#1c2940;border-radius:14px;padding:16px;margin:14px 0}button,input{font-size:16px}button{background:#5d9aff;border:0;border-radius:9px;padding:12px 15px;color:#07152c;font-weight:700;margin:5px 5px 5px 0}button:disabled{opacity:.45}audio{width:100%;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071120;border-radius:10px;padding:12px;font-size:12px;max-height:280px;overflow:auto}#pitch{font-size:24px;font-weight:700}label{display:block;margin-bottom:8px}</style></head><body><main><h1>Band Transcriber <small>v0.3 診断版</small></h1><p>iPhoneで再生できるM4Aから、再生中の音声信号を取得できるか調べます。音源を外部送信しません。これは採譜完成版ではありません。</p><section class="panel"><label for="file">① 音声ファイルを選択</label><input id="file" type="file" accept="audio/*,.m4a,.mp3,.wav"><p id="fileInfo" class="muted">未選択</p><audio id="player" controls playsinline preload="metadata"></audio></section><section class="panel"><p>② 下の「解析を開始」を押すと、音楽の再生と音声信号の取得を試します。</p><button id="start" disabled>解析を開始</button><button id="stop" disabled>停止</button><p id="state">待機中</p><div>取得信号の強さ：<strong id="level">—</strong></div><div>最大周波数付近（参考値）：<span id="pitch">—</span></div><p class="muted">※最大周波数は和音やドラムを含む完成音源では音符として正確ではありません。</p></section><section class="panel"><strong>③ 診断ログ</strong><pre id="log">起動しました。</pre><button id="copy">ログをコピー</button></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),audio=$('player');let ctx,source,analyser,stream,raf,objectUrl,started=false;const log=(message,err)=>{const suffix=err?' | '+(err.name||'Error')+': '+(err.message||String(err)):'';$('log').textContent+='\n'+new Date().toLocaleTimeString()+' '+message+suffix;$('log').scrollTop=$('log').scrollHeight};const status=s=>$('state').textContent=s;window.addEventListener('error',e=>log('JavaScriptエラー',e.error||e.message));window.addEventListener('unhandledrejection',e=>log('非同期エラー',e.reason));$('file').addEventListener('change',()=>{const f=$('file').files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.src=objectUrl;audio.load();$('fileInfo').textContent=`${f.name} / ${(f.size/1024/1024).toFixed(2)} MB / ${f.type||'形式不明'}`;$('start').disabled=false;log('ファイル選択完了：'+f.name);status('再生または解析を開始してください')});audio.addEventListener('loadedmetadata',()=>log('メタデータ取得：'+(Number.isFinite(audio.duration)?audio.duration.toFixed(1)+'秒':'長さ不明')));audio.addEventListener('error',()=>log('音声プレーヤーのエラー：'+(audio.error?.code||'不明')));function monitor(){if(!started||!analyser)return;try{const time=new Uint8Array(analyser.fftSize),freq=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(time);analyser.getByteFrequencyData(freq);let sum=0;for(const v of time)sum+=(v-128)*(v-128);const rms=Math.sqrt(sum/time.length)/128;$('level').textContent=rms.toFixed(4);let max=0,idx=0;for(let i=2;i<freq.length;i++){if(freq[i]>max){max=freq[i];idx=i}}const hz=idx*ctx.sampleRate/analyser.fftSize;$('pitch').textContent=max>12?Math.round(hz)+' Hz':'検出なし';raf=requestAnimationFrame(monitor)}catch(e){log('解析ループで失敗',e);stop()}}function stop(){started=false;cancelAnimationFrame(raf);audio.pause();$('stop').disabled=true;status('停止しました');log('停止')}async function start(){try{if(!audio.src)throw Error('音源が未選択です');status('音声解析を準備しています…');log('AudioContextの作成開始');const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)throw Error('Web Audio APIに非対応');if(!ctx){ctx=new AudioCtx();log('AudioContext作成成功：'+ctx.sampleRate+'Hz');source=ctx.createMediaElementSource(audio);log('MediaElementAudioSourceNode作成成功');analyser=ctx.createAnalyser();analyser.fftSize=4096;source.connect(analyser);analyser.connect(ctx.destination);log('音声ノード接続成功')}await ctx.resume();log('AudioContext状態：'+ctx.state);await audio.play();log('音声再生成功');started=true;$('stop').disabled=false;status('解析中。音楽を再生しています');monitor();setTimeout(()=>{if(started){const v=Number($('level').textContent);if(v===0)log('注意：信号レベルが0です。Safariの音声ルーティング等を確認してください');else log('音声信号を取得できています（レベル='+v+'）')}},2500)}catch(e){status('解析開始に失敗しました。ログを確認してください');log('解析開始失敗',e);started=false;$('stop').disabled=true}}$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('log').textContent);log('ログをコピーしました')}catch(e){log('コピー失敗：ログを長押しで選択してください',e)}});audio.addEventListener('ended',()=>{started=false;cancelAnimationFrame(raf);$('stop').disabled=true;status('再生終了');log('再生終了')});})();
</script></body></html>
